name: Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ensure installer compiler is available
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
          }
      - name: Build Windows app
        shell: pwsh
        run: ./tools/build-windows.ps1
      - name: Test desktop states without model downloads
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          MUSCRIPTOR_UI_PREVIEW_DIR: validation/ui-previews
        run: python -m unittest discover -s tests -p test_windows_ui.py -v
      - name: Check desktop layout at 150 percent scaling
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
        run: python -m unittest discover -s tests -p test_windows_ui.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-Previews
          path: validation/ui-previews/*.png
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process 'build/windows/dist/MuScriptor Local/MuScriptor Local.exe' -ArgumentList '--smoke-test' -PassThru
          if (!$process.WaitForExit(30000)) { $process.Kill(); throw 'App did not finish its startup check.' }
          if ($process.ExitCode -ne 0) { throw 'App startup check failed.' }
      - name: Smoke-test setup installer
        shell: pwsh
        run: |
          $directory = "$env:RUNNER_TEMP/MuScriptor Installed"
          $setup = Start-Process 'dist/windows/MuScriptor-Local-1.0-Beta-Windows-x64-Setup.exe' -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$directory`"" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Setup installer failed.' }
          $app = Start-Process "$directory/MuScriptor Local.exe" -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'Installed app startup timed out.' }
          if ($app.ExitCode -ne 0) { throw 'Installed app failed.' }
      - name: Install and test the Windows CPU worker
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./tools/bootstrap-windows.ps1 -Root "$env:RUNNER_TEMP/MuScriptor Engine" -Resources "$PWD" -Compute cpu
          if ($LASTEXITCODE -ne 0) { throw 'First-run setup failed.' }
          & "$env:RUNNER_TEMP/MuScriptor Engine/.venv/Scripts/python.exe" -m unittest discover -s tests -p test_wrapper.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Worker checks failed.' }
          & "$env:RUNNER_TEMP/MuScriptor Engine/.venv/Scripts/python.exe" -m unittest discover -s tests -p test_mac_options.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Shared transcription option checks failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: MuScriptor-Local-Windows-x64-Preview
          path: |
            dist/windows/*.zip
            dist/windows/*.exe
